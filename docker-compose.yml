version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ambulance_postgres
    restart: always
    environment:
      POSTGRES_DB: ambulancedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ambulance_backend
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=ambulancedb;Username=postgres;Password=postgres
      - Jwt__Secret=SuperSecretKeyForAmbulanceTrafficClearanceSystem2026!
      - Jwt__Issuer=AmbulanceClearanceAPI
      - Jwt__Audience=AmbulanceClearanceClients
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ambulance_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
